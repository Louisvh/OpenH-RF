name: Run example scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      KERAS_BACKEND: jax

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Check uv.lock is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --extra test --frozen

      - name: Format check with ruff
        run: uv run ruff format --check .

      - name: Lint with ruff
        run: uv run ruff check .

      # Generated from inputs that are committed with them.
      - name: Check the website's generated files are up to date
        run: |
          uv run --frozen python site/zea_keys.py
          uv run --frozen python site/corpus.py --allow-partial
          git diff --exit-code site/zea_keys.json site/hub/corpus.json site/hub/files.json

      - name: Run lightweight script tests
        run: uv run pytest tests/ -m "not heavy" -v
