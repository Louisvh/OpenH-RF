parameters:
    xlims:
    - -0.0191
    - 0.0191
    zlims:
    - 0.002
    - 0.04
    dynamic_range:
    - -50
    - 0
    apply_lens_correction: false
    f_number: 1.5
pipeline:
    operations:
    -   name: keras.ops.cast
        params:
            dtype: float32
    -   name: band_pass_filter
        params:
            num_taps: 255
            passband:
            - 1000000.0
            - 12000000.0
    - demodulate
    - beamform
    - envelope_detect
    -   name: normalize
        params:
            output_range:
            - 0.0
            - 1.0
    - log_compress
