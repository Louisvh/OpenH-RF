pipeline:
    operations:
    -   name: keras.ops.cast
        params:
            dtype: float32
    -   name: apply_window
        params:
            size: 64
            end: 96
    - demodulate
    - beamform
    - envelope_detect
    -   name: normalize
        params:
            output_range:
            - 0.0
            - 1.0
    - log_compress
parameters:
    grid_size_x: 960
    grid_size_z: 832
    xlims:
    - -0.1
    - 0.1
    zlims:
    - 0.0065
    - 0.18
    f_number: 1.0
    dynamic_range:
    - -60
    - 0
    apply_lens_correction: true
