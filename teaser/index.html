<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenH-RF | Coming 4 October 2026</title>
  <meta name="theme-color" content="#131416">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/teaser.css">
  <script defer src="assets/js/countdown.js"></script>
  <script defer src="assets/js/collage.js"></script>
</head>
<body>
  <main class="page">
    <div class="container">
      <div class="hero-examples">
        <div class="hero-track">
          <div class="hero-set">
            <img src="assets/img/examples.webp" srcset="assets/img/examples@2x.webp 2x" width="1235" height="397"
              alt="A mosaic of B-mode images from 26 of the datasets: clinical scans, phantoms and simulations.">
          </div>
          <div class="hero-set hero-copy" aria-hidden="true">
            <img src="assets/img/examples.webp" srcset="assets/img/examples@2x.webp 2x" width="1235" height="397" alt="">
          </div>
        </div>
      </div>
    </div>
    <div class="container center">
      <h1 class="hero-title">
        <img class="hero-logo" src="assets/img/logo.svg" alt="" width="231" height="180">
        OpenH-RF
      </h1>
      <p class="hero-lead">
        The largest, openly licensed dataset of medical ultrasound channel capture data.
      </p>
      <div class="hero-orgs">
        <a class="org-logo" href="https://www.tue.nl/en/research/" target="_blank" rel="noopener"><img src="assets/img/logos/tue.svg" alt="Eindhoven University of Technology"></a>
        <a class="org-logo" href="https://med.stanford.edu/" target="_blank" rel="noopener"><img src="assets/img/logos/stanford.svg" alt="Stanford University"></a>
        <a class="org-logo" href="https://www.nvidia.com/en-us/" target="_blank" rel="noopener"><img src="assets/img/logos/nvidia.svg" alt="NVIDIA"></a>
      </div>
      <div class="countdown">
        <div class="countdown-unit"><span class="countdown-num" data-unit="days">--</span><span class="countdown-label">Days</span></div>
        <span class="countdown-sep" aria-hidden="true">:</span>
        <div class="countdown-unit"><span class="countdown-num" data-unit="hours">--</span><span class="countdown-label">Hours</span></div>
        <span class="countdown-sep" aria-hidden="true">:</span>
        <div class="countdown-unit"><span class="countdown-num" data-unit="minutes">--</span><span class="countdown-label">Minutes</span></div>
        <span class="countdown-sep" aria-hidden="true">:</span>
        <div class="countdown-unit"><span class="countdown-num" data-unit="seconds">--</span><span class="countdown-label">Seconds</span></div>
      </div>
      <p class="countdown-done" hidden>Now live</p>
    </div>
  </main>
</body>
</html>
